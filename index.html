    <script>
      // Apply the saved theme before the first paint so dark themes never flash.
      (function () {
        try {
          var LEGACY = { light: 'classic', dark: 'midnight' };
          var KNOWN = ['classic', 'midnight', 'forest', 'glacier', 'sand', 'space', 'anime'];
          var key = localStorage.getItem('aman-tracker-theme');
          key = LEGACY[key] || key;
          if (KNOWN.indexOf(key) === -1) key = 'classic';
          var root = document.documentElement;
          root.setAttribute('data-theme', key);
          if (key === 'midnight' || key === 'space') root.classList.add('dark');
        } catch (e) { /* ignore */ }
      })();
    </script>
